metadata:
  id: dhictl
  sourceRepo: github.com/ajeetraina/labspace-dhictl
  contentVersion: abcd123 # Will be filled in during CI

title: Securing the Supply Chain with dhictl & Docker Hardened Images
description: |
  Take a vulnerable Product Catalog service, surface its CVEs, then use the
  dhictl CLI to browse, adopt, inspect, and customize Docker Hardened Images
  (DHI) slashing the attack surface and verifying the supply chain.

sections:
  - title: Introduction & Setup
    contentPath: 01-introduction.md
  - title: Meet the Product Catalog
    contentPath: 02-product-catalog.md
  - title: Introducing Vulnerabilities
    contentPath: 03-introducing-vulnerabilities.md
  - title: Browsing the DHI Catalog
    contentPath: 04-browsing-dhi-catalog.md
  - title: Migrating to a Hardened Image
    contentPath: 05-migrating-to-dhi.md
  - title: Supply Chain & dhictl Capabilities
    contentPath: 06-supply-chain-and-capabilities.md

